<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DERO Patcher</title>
<style>
:root {
  --bg: #0a0c0f; --panel: #12161c; --panel2: #181e26; --panel3: #1f2630;
  --line: #232b35; --line2: #303a47;
  --text: #ece8e1; --muted: #939dab; --dim: #7d8795;
  --accent: #ff6b1a; --accent2: #ffa057; --glow: rgba(255,107,26,.35); --changed: rgba(255,107,26,.10);
  --good: #57d17a; --bad: #ff6b6b; --uv: #a88dff;
  --r-white: #c9d1d9; --r-green: #57d17a; --r-blue: #4aa3ff; --r-violet: #b07cff; --r-orange: #ff9a3c;
  --fd: "Bahnschrift", "DIN Alternate", "Barlow Semi Condensed", "Arial Narrow", sans-serif;
  --fb: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--fb); overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(900px 500px at 12% -10%, rgba(255,107,26,.13), transparent 60%),
    radial-gradient(700px 500px at 110% 110%, rgba(155,123,255,.07), transparent 60%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { position: relative; z-index: 1; display: grid; grid-template-columns: 236px 1fr; grid-template-rows: 100%; height: 100vh; }

/* ---------- Sidebar ---------- */
.side { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; border-right: 1px solid var(--line); background: rgba(10,12,15,.72); backdrop-filter: blur(6px); }
.logo { padding: 22px 22px 18px; border-bottom: 1px solid var(--line); }
.logo .mark { font: 700 30px/1 var(--fd); letter-spacing: .1em; display: flex; align-items: center; gap: 10px; }
.logo .mark i { width: 6px; height: 26px; background: var(--accent); transform: skewX(-18deg); box-shadow: 0 0 18px var(--glow); }
.logo .mark b { font-weight: 700; }
.logo .mark span { color: var(--accent); }
.logo .sub { margin-top: 8px; font: 600 11px/1 var(--fd); letter-spacing: .32em; color: var(--muted); text-transform: uppercase; }
nav { padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
.nav { position: relative; display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 0; border-radius: 8px;
  background: none; text-align: left; color: var(--muted); font: 600 15px/1 var(--fd); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.nav svg { width: 19px; height: 19px; flex: none; stroke: currentColor; }
.nav:hover { color: var(--text); background: var(--panel); }
.nav.active { color: var(--text); background: var(--panel2); }
.nav.active::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); box-shadow: 0 0 12px var(--glow); }
.nav .badge { margin-left: auto; min-width: 22px; padding: 3px 7px; border-radius: 99px; background: var(--accent); color: #1a0d04; font: 700 12px/1 var(--fd); text-align: center; letter-spacing: 0; }
.status { margin-top: auto; padding: 16px 18px 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); display: grid; gap: 12px; }
.status .row { display: flex; gap: 9px; align-items: flex-start; }
.status .dot { width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); flex: none; }
.status .dot.mod { background: var(--accent); box-shadow: 0 0 8px var(--glow); }
.status .dot.off { background: var(--dim); box-shadow: none; }
.status b { display: block; color: var(--text); font-weight: 600; }
.status code { font: 11px/1.3 Consolas, monospace; color: var(--dim); word-break: break-all; }
.status .note { font-size: 11px; color: var(--dim); }
.linkbtn { display: inline-block; margin-top: 6px; border: 1px solid var(--line2); background: var(--panel); color: var(--muted); padding: 5px 10px; border-radius: 7px; font-size: 12px; }
.linkbtn:hover { color: var(--text); border-color: var(--bad); }

/* ---------- Main ---------- */
.main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
header { display: flex; align-items: flex-end; gap: 24px; padding: 26px 32px 18px; border-bottom: 1px solid var(--line); }
header h1 { margin: 0; font: 700 30px/1 var(--fd); letter-spacing: .06em; text-transform: uppercase; }
header p { margin: 8px 0 0; color: var(--muted); max-width: 640px; }
.presets { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.presets .lbl { font: 600 11px/1 var(--fd); letter-spacing: .24em; color: var(--dim); text-transform: uppercase; }
.presets .pdesc { max-width: 330px; font-size: 12px; color: var(--muted); text-align: right; min-height: 17px; }
.seg { display: flex; padding: 3px; border: 1px solid var(--line2); border-radius: 9px; background: var(--panel); }
.seg button { border: 0; background: none; padding: 7px 14px; border-radius: 6px; color: var(--muted); font: 600 13px/1 var(--fd); letter-spacing: .08em; text-transform: uppercase; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--accent); color: #1a0d04; box-shadow: 0 0 16px var(--glow); }
.seg .custom { padding: 7px 12px; color: var(--accent2); font: 600 13px/1 var(--fd); letter-spacing: .08em; text-transform: uppercase; }
.content { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 32px 130px; scrollbar-color: var(--line2) transparent; }

/* ---------- Toolbar / Chips ---------- */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
.toolbar:empty { display: none; }
.chip { border: 1px solid var(--line2); background: var(--panel); color: var(--muted); padding: 7px 13px; border-radius: 99px; font-size: 13px; }
.chip:hover { color: var(--text); }
.chip.on { border-color: var(--accent); color: var(--text); background: var(--changed); }
.chip.sec-reset { margin-left: auto; }
.chip.sec-reset:hover { border-color: var(--accent); }
.search { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--line2); border-radius: 8px; background: var(--panel); min-width: 220px; }
.search:focus-within { border-color: var(--accent); }
.search input { border: 0; outline: 0; background: none; width: 100%; }
.search svg { width: 15px; height: 15px; stroke: var(--dim); flex: none; }
.toolbar .search { margin-left: auto; }
.toolbar .search + .sec-reset { margin-left: 0; }

/* ---------- Cards ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.card { position: relative; background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 12px; padding: 16px 16px 12px; transition: border-color .15s; }
.card.changed, .panel.changed { border-color: rgba(255,107,26,.55); box-shadow: 0 0 0 1px rgba(255,107,26,.12), 0 8px 30px -12px var(--glow); }
.card.changed::after { content: "GEÄNDERT"; position: absolute; top: -1px; right: 16px; padding: 3px 8px 4px; border-radius: 0 0 6px 6px; background: var(--accent); color: #1a0d04; font: 700 10px/1 var(--fd); letter-spacing: .14em; }
.card-h { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
.card-h .name { font: 700 18px/1.15 var(--fd); letter-spacing: .03em; }
.card-h .meta { margin-top: 4px; font-size: 12px; color: var(--dim); }
.tiers { margin-left: auto; display: flex; gap: 4px; padding-top: 14px; }
.tier { width: 30px; height: 26px; border: 1px solid var(--line2); border-radius: 6px; background: var(--panel); color: var(--muted); font: 700 12px/1 var(--fd); position: relative; }
.tier::after { content: ""; position: absolute; left: 7px; right: 7px; bottom: 3px; height: 2px; border-radius: 2px; background: var(--c); opacity: .8; }
.tier.on { color: var(--text); border-color: var(--c); background: var(--panel3); }
.tier.mod::before { content: ""; position: absolute; top: -4px; right: -4px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--glow); }
.rows { display: grid; gap: 7px; }
.row { display: flex; align-items: center; gap: 10px; min-height: 34px; }
.row .lab { display: flex; align-items: center; gap: 8px; color: var(--text); }
.row .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.sep { height: 1px; background: var(--line); margin: 4px 0; }
.was { min-width: 30px; border: 0; background: none; padding: 2px 4px; border-radius: 5px; font-size: 12px; color: var(--dim); text-decoration: line-through; text-align: right; }
.was:hover { color: var(--accent2); text-decoration: none; }
.was:hover::before { content: "↺ "; }
.was.hide { visibility: hidden; }
.info { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.pill { font-size: 12px; color: var(--muted); padding: 4px 9px; border-radius: 6px; background: var(--panel3); }
.pill b { color: var(--text); font-weight: 600; }
.card-f { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--muted); min-height: 33px; }
.card-f .reset { margin-left: auto; border: 0; background: none; color: var(--dim); font-size: 12px; }
.card-f .reset:hover { color: var(--accent2); }
.link { border: 0; background: none; padding: 0; color: var(--accent2); font-size: 12px; }
.link:hover { text-decoration: underline; }
.ut { display: inline-block; margin-left: 10px; vertical-align: 2px; font: 600 10px/1 var(--fd); letter-spacing: .14em; text-transform: uppercase; color: var(--uv);
  border: 1px solid rgba(168,141,255,.45); padding: 3px 6px; border-radius: 5px; cursor: help; }
.row .ut { margin-left: 2px; vertical-align: 0; }

/* Stepper */
.step { display: inline-flex; align-items: stretch; border: 1px solid var(--line2); border-radius: 8px; background: var(--bg); overflow: hidden; }
.step:focus-within { border-color: var(--accent); }
.step button { width: 28px; border: 0; background: var(--panel3); color: var(--muted); font-size: 16px; line-height: 1; }
.step button:hover { color: var(--text); background: var(--line2); }
.step button:focus-visible { outline-offset: -2px; }
.step input { width: 58px; border: 0; outline: 0; background: none; text-align: center; font: 600 16px/1 var(--fd); padding: 6px 0; }
.step.ch { border-color: var(--accent); background: var(--changed); }
.step.ch input { color: var(--accent2); }

/* Slider panels */
.panel { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; transition: border-color .15s; }
.panel h2 { margin: 0 0 4px; font: 700 17px/1.2 var(--fd); letter-spacing: .05em; text-transform: uppercase; }
.panel .hint { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
.srow { display: grid; grid-template-columns: minmax(170px, 1fr) minmax(120px, auto) minmax(160px, 1.6fr) 70px 24px; align-items: center; gap: 14px; padding: 9px 0; border-top: 1px solid var(--line); }
.panel > .srow:first-of-type { border-top: 0; }
.srow .n small { display: block; color: var(--dim); font-size: 12px; }
.srow .n small.df { color: var(--uv); }
.srow .n small.sub b { color: var(--accent2); font-weight: 600; }
.srow .vals { font: 600 15px/1 var(--fd); letter-spacing: .02em; white-space: nowrap; }
.srow .vals .o { color: var(--dim); }
.srow .vals .arrow { color: var(--dim); margin: 0 6px; }
.srow .vals .nw { color: var(--text); }
.srow .vals .orig { color: var(--dim); font-weight: 400; font-size: 13px; }
.srow.ch .vals .nw { color: var(--accent2); }
.srow .mult { font: 700 16px/1 var(--fd); text-align: right; color: var(--muted); white-space: nowrap; }
.srow.ch .mult { color: var(--accent); }
.rst { width: 24px; height: 24px; border: 0; border-radius: 6px; background: none; color: var(--dim); font-size: 15px; }
.rst:hover { color: var(--accent2); background: var(--panel3); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; cursor: pointer; border-radius: 4px;
  background: linear-gradient(var(--dim), var(--dim)) no-repeat; background-size: 2px 14px;
  background-position: calc(7px + (100% - 16px) * var(--o, 0) / 100) 50%; }
input[type=range].no-o { background: none; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--accent) var(--p, 0%), var(--line2) var(--p, 0%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: var(--text); border: 3px solid var(--accent); box-shadow: 0 0 10px var(--glow); }
input[type=range]:focus-visible { outline-offset: 0; }
input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: var(--line2); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--accent); }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--text); border: 3px solid var(--accent); }
.gcols { columns: 2 520px; column-gap: 16px; }
.gcols .panel { break-inside: avoid; }
.gcols .srow { grid-template-columns: minmax(150px, 1.2fr) minmax(90px, auto) minmax(110px, 1fr) 64px 24px; gap: 12px; }
.sub-h { margin: 14px 0 2px; font: 600 11px/1 var(--fd); letter-spacing: .22em; text-transform: uppercase; color: var(--dim); }

/* Matrix */
table.mx { width: 100%; border-collapse: separate; border-spacing: 0; }
.mx th { text-align: left; font: 600 12px/1 var(--fd); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); padding: 10px 12px; }
.mx td { padding: 12px; border-top: 1px solid var(--line); vertical-align: top; }
.mx td:first-child { font: 700 15px/1.2 var(--fd); letter-spacing: .03em; white-space: nowrap; }
.mx .part { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); padding: 2px 0; }
.mx .part b { font: 600 14px/1.2 var(--fd); color: var(--text); white-space: nowrap; }
.mx .part.ch b { color: var(--accent2); }
.mx .part.ch s { color: var(--dim); font: 12px var(--fd); margin-right: 5px; }

/* Rarity / Inventar */
.rar { width: 10px; height: 10px; border-radius: 3px; background: var(--c); box-shadow: 0 0 8px var(--c); flex: none; }
.irow { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.sub-h + .irow { border-top: 0; }
.irow small { display: block; color: var(--dim); font-size: 12px; }
.irow .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.example { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: var(--bg); border: 1px dashed var(--line2); color: var(--muted); font-size: 13px; }
.example b { color: var(--accent2); font: 700 15px var(--fd); }

/* ---------- Action bar ---------- */
.bar { position: absolute; left: 20px; right: 20px; bottom: 16px; display: flex; align-items: center; gap: 14px; padding: 12px 12px 12px 20px;
  border: 1px solid var(--line2); border-radius: 14px; background: rgba(18,22,28,.9); backdrop-filter: blur(12px); box-shadow: 0 18px 40px -10px rgba(0,0,0,.7); }
.bar .count { font: 700 26px/1 var(--fd); color: var(--accent); min-width: 30px; }
.bar .count.zero { color: var(--dim); }
.bar .what { font-size: 12px; color: var(--muted); line-height: 1.35; min-width: 0; }
.bar .what b { display: block; color: var(--text); font: 600 14px/1.2 var(--fd); letter-spacing: .05em; text-transform: uppercase; }
.bar .sp { flex: 1; }
.modc { text-align: right; font-size: 12px; color: var(--muted); line-height: 1.35; padding-right: 6px; }
.modc b { display: block; font: 700 17px/1.1 var(--fd); letter-spacing: .12em; color: var(--text); }
.modc .ok { color: var(--good); }
.modc .pend { color: var(--accent2); }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line2); background: var(--panel2); padding: 10px 16px; border-radius: 10px; font: 600 14px/1 var(--fd); letter-spacing: .08em; text-transform: uppercase; color: var(--text); }
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; stroke: currentColor; }
.btn.danger:hover { border-color: var(--bad); color: #ffd0d0; }
.btn.primary { position: relative; overflow: hidden; border: 0; padding: 13px 30px; font-size: 17px; letter-spacing: .14em; color: #1a0d04;
  background: linear-gradient(180deg, #ff8a3d, var(--accent)); box-shadow: 0 0 0 1px rgba(255,160,87,.5) inset, 0 8px 26px -6px var(--glow); }
.btn.primary::before { content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity .2s;
  background: repeating-linear-gradient(-45deg, rgba(0,0,0,.14) 0 10px, transparent 10px 20px); }
.btn.primary:hover::before { opacity: 1; }
.btn.primary span { position: relative; }
.btn.small { padding: 10px 18px; font-size: 14px; }

/* ---------- Modal / Toast ---------- */
.modal { position: fixed; inset: 0; z-index: 10; display: none; place-items: center; background: rgba(4,5,7,.7); backdrop-filter: blur(4px); }
.modal.open { display: grid; }
.dlg { width: min(540px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line2); border-radius: 16px; padding: 24px; box-shadow: 0 30px 80px -20px #000; }
.dlg h3 { margin: 0 0 6px; font: 700 22px/1.1 var(--fd); letter-spacing: .06em; text-transform: uppercase; }
.dlg p { color: var(--muted); margin: 0 0 16px; }
.dlg .lbl { display: block; margin: 16px 0 8px; font: 600 12px/1 var(--fd); letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
.code { display: flex; gap: 8px; }
.code input { flex: 1; min-width: 0; padding: 11px 12px; border-radius: 9px; border: 1px solid var(--line2); background: var(--bg); font: 13px Consolas, monospace; color: var(--accent2); outline: 0; }
.code input:focus { border-color: var(--accent); }
.shint { margin-top: 8px; font-size: 12px; color: var(--dim); min-height: 18px; }
.shint.ok { color: var(--good); }
.shint.err { color: var(--bad); }
.dlg .acts { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.dlg .acts:empty { display: none; }
.sumlist { display: grid; gap: 6px; margin: 4px 0 14px; padding: 12px 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.sumlist div { display: flex; justify-content: space-between; gap: 10px; }
.sumlist b { font: 700 15px/1.2 var(--fd); color: var(--accent2); }
.checks { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; font-size: 13px; color: var(--muted); }
.checks li::before { content: "✓"; color: var(--good); margin-right: 8px; }
.checks li.warn::before { content: "!"; color: #1a0d04; background: var(--accent2); border-radius: 50%; display: inline-grid; place-items: center; width: 15px; height: 15px; font: 700 11px/1 var(--fd); }
.checks b { color: var(--text); letter-spacing: .06em; }
.steps { display: grid; gap: 10px; margin: 6px 0 4px; }
.stp { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; color: var(--dim); transition: color .2s; }
.stp i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line2); display: grid; place-items: center; font-style: normal; font-size: 11px; }
.stp.run { color: var(--text); }
.stp.run i { border-color: var(--accent); border-top-color: transparent; animation: spin .7s linear infinite; }
.stp.done { color: var(--text); }
.stp.done i { border-color: var(--good); background: var(--good); color: #062; }
.stp .files { flex-basis: 100%; padding-left: 32px; color: var(--dim); font-size: 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.result { margin-top: 4px; padding: 16px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line2); text-align: center; }
.result .big { font: 700 32px/1 var(--fd); letter-spacing: .12em; color: var(--accent); margin: 8px 0 12px; }
.result small { color: var(--muted); }
.coop { margin-top: 14px; padding: 14px; border-radius: 12px; border: 1px solid rgba(168,141,255,.35); background: rgba(155,123,255,.07); font-size: 13px; color: var(--muted); }
.coop b { color: var(--text); }
.coop .btn { margin-top: 10px; }
.toast { position: fixed; left: 50%; top: 22px; z-index: 20; display: flex; align-items: center; gap: 12px; transform: translate(-50%, -30px); opacity: 0; pointer-events: none; transition: all .25s;
  padding: 10px 12px 10px 16px; border-radius: 10px; background: var(--panel3); border: 1px solid var(--line2); font-size: 13px; box-shadow: 0 10px 30px -10px #000; }
.toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.toast button { border: 1px solid var(--accent); background: var(--changed); color: var(--accent2); border-radius: 7px; padding: 4px 10px; font-size: 12px; }
.proto { display: inline-block; margin-top: 12px; font: 700 10px/1 var(--fd); letter-spacing: .2em; color: var(--uv); border: 1px solid rgba(168,141,255,.4); padding: 5px 8px; border-radius: 6px; background: rgba(155,123,255,.08); }
.empty { color: var(--dim); padding: 40px; text-align: center; }
.proto[hidden] { display: none; }
#banners:empty { display: none; }
#banners { display: grid; gap: 8px; padding: 14px 32px 0; }
.banner { display: flex; align-items: center; gap: 14px; padding: 10px 12px 10px 16px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel2); font-size: 13px; color: var(--muted); }
.banner b { color: var(--text); }
.banner .btn { margin-left: auto; padding: 7px 12px; font-size: 12px; }
.banner.warn { border-color: rgba(255,160,87,.5); background: rgba(255,107,26,.08); }
.banner.upd { border-color: rgba(87,209,122,.45); background: rgba(87,209,122,.07); }
.banner .ic { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 13px/1 var(--fd); color: #0a0c0f; background: var(--accent2); }
.banner.upd .ic { background: var(--good); }
.status .warn { color: var(--accent2); }
.status .ver { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--dim); }

.status .ver button:hover { color: var(--text); }
.notes { max-height: 240px; overflow: auto; white-space: pre-wrap; margin: 0; padding: 12px 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); font: 13px/1.5 var(--fb); }
.notes:empty { display: none; }
.err { color: var(--bad); }
.overlay { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(4,5,7,.85); backdrop-filter: blur(6px); text-align: center; }
.overlay[hidden] { display: none; }
.overlay > div { display: grid; gap: 10px; justify-items: center; color: var(--muted); }
.overlay b { font: 700 24px/1.1 var(--fd); letter-spacing: .06em; text-transform: uppercase; color: var(--text); }
.spin { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--line2); border-top-color: var(--accent); animation: spin .8s linear infinite; }
.nogame { max-width: 560px; margin: 12vh auto; padding: 0 24px; }
.nogame h1 { font: 700 30px/1.1 var(--fd); letter-spacing: .06em; text-transform: uppercase; }
.nogame p { color: var(--muted); }
.nogame code { font: 12px Consolas, monospace; color: var(--accent2); }

@media (max-width: 1100px) {
  .srow { grid-template-columns: minmax(150px, 1fr) minmax(100px, auto) minmax(120px, 1.2fr) 64px 24px; gap: 10px; }
}
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .side { flex-direction: row; align-items: center; overflow: auto hidden; scrollbar-width: none; border-right: 0; border-bottom: 1px solid var(--line); }

  nav { flex-direction: row; padding: 8px; }

  header { flex-wrap: wrap; padding: 16px; gap: 12px; }

  .content { padding: 16px 16px 150px; }
  .srow, .gcols .srow { grid-template-columns: 1fr auto 24px; grid-template-areas: "n mult rst" "vals vals vals" "sl sl sl"; row-gap: 6px; }
  .srow > .n { grid-area: n; } .srow > .vals { grid-area: vals; } .srow > .mult { grid-area: mult; }
  .srow > input[type=range] { grid-area: sl; } .srow > .rst { grid-area: rst; }

}

<script>
// Start: echte Daten von der DERO-Patcher.exe (Token in der URL), sonst Demo mit ui/data.js
const TOKEN = new URLSearchParams(location.search).get("t");
async function api(path, body) {
  const r = await fetch(path, { method: body === undefined ? "GET" : "POST", headers: { "X-Dero-Token": TOKEN, "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body), keepalive: path === "/api/bye" });
  const j = await r.json().catch(() => ({}));
  if (!r.ok && !j.error) j.error = "Unerwartete Antwort (" + r.status + ")";
  return j;
}
function noGame(server) {
  document.querySelector(".main").innerHTML = `<div class="nogame"><h1>Spiel nicht gefunden</h1>
    <p>${(server.game.error || "Der Spielordner wurde nicht automatisch gefunden.").replace(/</g, "&lt;")}</p>
    <p>Wähle den Ordner <b>„Dying Light The Beast“</b> aus, normalerweise unter <code>Steam\\steamapps\\common</code>.</p>
    <button class="btn primary" id="btnBrowse0"><span>Spielordner wählen</span></button><p class="err" id="browseErr"></p></div>`;
  document.getElementById("btnBrowse0").onclick = async () => {
    const r = await api("/api/browse", {});
    if (r.ok && r.found) location.reload();
    else if (r.ok) document.getElementById("browseErr").textContent = r.error || "In diesem Ordner wurde das Spiel nicht gefunden.";
  };
}
(async function boot() {
  let server = null;
  if (TOKEN) {
    try { server = await api("/api/state"); } catch { document.body.innerHTML = "<p style='padding:40px'>Verbindung zum DERO-Patcher verloren. Bitte das Tool neu starten.</p>"; return; }
    if (!server.data) { noGame(server); return; }
    window.DATA = server.data;
  } else {
    await new Promise((res, rej) => { const s = document.createElement("script"); s.src = "data.js"; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  }
  window.SERVER = server;
  const app = document.createElement("script");
  app.textContent = document.getElementById("app").textContent;
  document.body.appendChild(app);
})();
</script>
<script type="text/plain" id="app">
const D = window.DATA, SERVER = window.SERVER, LIVE = !!SERVER, VERSION = LIVE ? SERVER.version : "Demo";
const $ = s => document.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const de = (n, d = 0) => n.toLocaleString("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d });
const num = (x, dec = 0) => { const r = +(+x).toFixed(dec); return de(r, Number.isInteger(r) ? 0 : dec); };
// Eingabefelder ohne Tausenderpunkt, sonst liest parseFloat "5.000" als 5
const plain = (v, dec = 0) => v.toLocaleString("de-DE", { useGrouping: false, minimumFractionDigits: dec, maximumFractionDigits: dec });
function parseNum(str, dec) {
  let s = String(str).trim().replace(/\s/g, "");
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  else if (!dec) s = s.replace(/\./g, "");
  return parseFloat(s);
}

const CATS = { wurf: "Wurfwaffen", heil: "Heilung", muni: "Munition", spreng: "Sprengstoff", werkzeug: "Werkzeug" };
const ICON = {
  glob: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  craft: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
  loot: '<path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  dis: '<path d="M4 20l6-6M14 4l6 6-8 8-6-6z"/><path d="M11 9l4 4"/>',
  trade: '<circle cx="9" cy="9" r="6"/><path d="M15.5 9.5A6 6 0 1 1 9.5 15.5"/>',
};
const SECTIONS = [
  { id: "glob", label: "Global", title: "Globale Einstellungen", desc: "Gilt für das ganze Spiel. Werte anderer Schwierigkeitsgrade ändern sich im gleichen Verhältnis mit." },
  { id: "craft", label: "Crafting", title: "Crafting", desc: "Rezepte günstiger machen, mehr pro Craft herausholen und Wurfwaffen stärker machen." },
  { id: "loot", label: "Loot", title: "Loot & Funde", desc: "Wie viel Material und Geld du beim Plündern findest. Der Regler vervielfacht die Menge pro Fund." },
  { id: "dis", label: "Zerlegen", title: "Zerlegen", desc: "Wie viel Material beim Zerlegen von Waffen herauskommt – die beste Quelle für Klingen." },
  { id: "trade", label: "Händler", title: "Händler", desc: "Wie viel dir Händler zahlen und was Einkäufe kosten." },
];
const TIERC = ["var(--r-white)", "var(--r-green)", "var(--r-blue)", "var(--r-violet)", "var(--r-orange)"];
const UT = '<span class="ut" title="Noch nicht im Spiel ausprobiert. Die Wirkung ist aus dem Spielcode abgeleitet.">ungetestet</span>';
const KNIFE = "Craftplan_ThrowingKnives_FT";

// ---------- Zustand ----------
const CAT_ORDER = Object.keys(CATS);
D.crafting.sort((a, b) => CAT_ORDER.indexOf(a.cat) - CAT_ORDER.indexOf(b.cat) || (a.id === KNIFE ? -1 : b.id === KNIFE ? 1 : a.name.localeCompare(b.name, "de")));
const FAM = Object.fromEntries(D.crafting.map(f => [f.id, f]));
const GITEMS = Object.fromEntries(D.global.flatMap(g => g.items).map(i => [i.id, i]));
const GCHIPS = { all: "Alle", fort: "Fortschritt", survive: "Überleben", beast: "Beast-Modus", gear: "Ausrüstung & Inventar" };
const DIS_MATS = [...new Map(D.dismantle.flatMap(x => x.parts.map(p => [p.item, p.name]))).entries()].map(([item, name]) => ({ item, name }));
const LOOT = Object.fromEntries(D.loot.map(l => [l.id, l]));
const MONEY = Object.fromEntries(D.money.map(m => [m.id, m]));
const SELL = Object.fromEntries(D.trade.sell.map(t => [t.id, t]));

function original() {
  const s = { glob: {}, craft: {}, loot: {}, money: {}, dis: {}, trade: {} };
  for (const id in GITEMS) s.glob[id] = GITEMS[id].value;
  for (const f of D.crafting) s.craft[f.id] = f.tiers.map(t => ({ mats: t.mats.map(m => m[1]), out: t.out, head: t.head ?? null }));
  for (const l of D.loot) s.loot[l.id] = 1;
  for (const m of D.money) s.money[m.id] = 1;
  for (const m of DIS_MATS) s.dis[m.item] = 1;
  for (const t of D.trade.sell) s.trade[t.id] = t.value;
  s.trade.buy = D.trade.buy;
  return s;
}
const ORIG = original();
const PRESETS = {
  original: () => clone(ORIG),
  dero: () => {
    const s = clone(ORIG), f = FAM[KNIFE];
    s.craft[f.id].forEach((t, i) => {
      f.tiers[i].mats.forEach((m, j) => { if (/wiring/i.test(m[0])) t.mats[j] = 1; });
      t.out = 5; t.head = 3;
    });
    return s;
  },
  big: () => {
    const s = clone(ORIG);
    for (const id in s.craft) s.craft[id].forEach(t => { t.mats = t.mats.map(v => Math.max(1, Math.ceil(v / 2))); t.out = t.out * 2; });
    for (const k in s.loot) s.loot[k] = 2;
    for (const k in s.money) s.money[k] = 2;
    for (const k in s.dis) s.dis[k] = 2;
    for (const t of D.trade.sell) s.trade[t.id] = Math.min(1, +(t.value * 3).toFixed(2));
    s.trade.buy = 0.75;
    Object.assign(s.glob, { ActionsXPMultiplier: 1.5, LegendBonus_Coop: 1.3, DeathPenalty: 0.5, StaminaRegenerationMul: 1.3,
      MedkitHeal: 1.5, CraftDropped: 0.5, MeleeWpnDurabilityMulReduce: 0.75, PerfectRepairChance: 0.25 });
    for (const [id, i] of Object.entries(GITEMS)) {
      if (id.startsWith("Repair_")) s.glob[id] = i.value + 2;
      if (i.group === "Plätze") s.glob[id] = Math.round(i.value * 1.5);
      if (i.group === "Stapelgröße") s.glob[id] = Math.min(9999, i.value * 2);
    }
    return s;
  },
};
const PRESET_INFO = {
  original: ["Original", "Alles wie im Spiel."],
  dero: ["DERO", "Eure Koop-Einstellung: Wurfmesser kosten 1 Draht, geben 5 Stück, Kopfschuss ×3."],
  big: ["Großzügig", "Halbe Rezeptkosten, doppelter Output und Loot, bessere Händlerpreise, mehr Platz, leichteres Überleben."],
};

// installed = { pak, code, diff, legacy, outdated } – die Mod-Datei im Spielordner (liefert die .exe)
let installed = LIVE ? (SERVER.installed || null) : { pak: "data2.pak", legacy: false, outdated: false };
let S = PRESETS.dero();
if (installed && installed.diff && !installed.legacy) { try { S = validate(installed.diff); } catch {} }
if (!LIVE) { installed.diff = diff(); installed.code = fnvCode(installed.diff); }
// Stabiler Vergleich unabhängig von der Schlüssel-Reihenfolge
const stable = o => JSON.stringify(o, (k, v) => v && typeof v === "object" && !Array.isArray(v) ? Object.fromEntries(Object.keys(v).sort().map(x => [x, v[x]])) : v);
const isInstalled = () => !!installed && !installed.legacy && !installed.outdated && stable(installed.diff || {}) === stable(diff());
const ui = { sec: "glob", cat: "all", gchip: "all", q: "", only: false, tier: {}, split: {} };

function changes(st = S) {
  const c = { glob: [], craft: [], loot: [], dis: [], trade: [] };
  for (const k in st.glob) if (st.glob[k] !== ORIG.glob[k]) c.glob.push(k);
  for (const f of D.crafting) if (!eq(st.craft[f.id], ORIG.craft[f.id])) c.craft.push(f.id);
  for (const k in st.loot) if (st.loot[k] !== 1) c.loot.push(k);
  for (const k in st.money) if (st.money[k] !== 1) c.loot.push(k);
  for (const k in st.dis) if (st.dis[k] !== 1) c.dis.push(k);
  for (const k in st.trade) if (st.trade[k] !== ORIG.trade[k]) c.trade.push(k);
  return c;
}
const total = c => Object.values(c).reduce((a, x) => a + x.length, 0);
const summary = c => SECTIONS.filter(s => c[s.id].length).map(s => `${s.label} ${c[s.id].length}`).join(" · ");
const activePreset = () => Object.keys(PRESETS).find(k => eq(PRESETS[k](), S));
const tiersDiffer = fam => S.craft[fam].some(t => !eq(t, S.craft[fam][0]));

// ---------- Bausteine ----------
function stepper(path, v, o, opt = {}) {
  const dec = opt.dec || 0, ch = Math.abs(v - o) > 1e-9, lab = esc(opt.label || "Wert");
  return `<button class="was${ch ? "" : " hide"}" data-reset-path="${path}" title="Auf Original (${num(o, dec)}) zurücksetzen"
      aria-label="${lab} auf Original ${num(o, dec)} zurücksetzen"${ch ? "" : ' tabindex="-1" aria-hidden="true"'}>${num(o, dec)}</button>
    <div class="step${ch ? " ch" : ""}" data-path="${path}" data-step="${opt.step || 1}" data-min="${opt.min ?? 0}" data-max="${opt.max ?? 999}" data-dec="${dec}">
      <button data-d="-1" aria-label="${lab} verringern">−</button><input value="${plain(v, dec)}" inputmode="decimal" aria-label="${lab}"><button data-d="1" aria-label="${lab} erhöhen">+</button>
    </div>`;
}
function slider(path, v, min, max, step, o, label) {
  const pct = x => ((x - min) / (max - min)) * 100;
  const hasO = o >= min && o <= max;
  return `<input type="range" data-path="${path}" min="${min}" max="${max}" step="${step}" value="${v}" aria-label="${esc(label)}"
    style="--p:${pct(v)}%;${hasO ? `--o:${pct(o)}` : ""}"${hasO ? ' title="Der Strich markiert den Originalwert"' : ' class="no-o"'}>`;
}
const range = (a, b) => (a === b ? de(a) : `${de(a)}–${de(b)}`);
const mul = (v, m) => Math.round(v * m);
const rangeInfo = (min, max, m, unit = "", pre = "") => m === 1
  ? `<span class="nw">${pre}${range(min, max)}${unit}</span>`
  : `<span class="o">${pre}${range(min, max)}</span><span class="arrow">→</span><span class="nw">${range(mul(min, m), mul(max, m))}${unit}</span>`;
const prevInfo = (changed, text) => changed ? `<span class="orig">vorher ${text}</span>` : `<span class="orig">Original</span>`;

// Jede Regler-Zeile wird aus einem Modell gebaut. Beim Ziehen wird nur die Zeile aktualisiert.
const DIFF_ORDER = ["Leicht", "Schwer", "Albtraum"];
function gfmt(i, v) {
  const d = i.step < 0.1 ? 2 : 1;
  switch (i.fmt) {
    case "x": return "×" + de(v, d);
    case "pct": return de(v * 100) + " %";
    case "plus": return "+" + de(v * 100) + " %";
    case "pctv": return de(v) + " %";
    case "s": return de(v, 1) + " s";
    default: return de(v);
  }
}
function gdiff(i, v) {
  if (!i.diff) return "";
  const o = i.value, n = i.diff.Normal;
  const conv = d => i.mode === "add" ? d + (v - o) : i.fmt === "pct" && o === 1 ? (d / n) * v : o ? d * v / o : d;
  const parts = DIFF_ORDER.filter(k => k in i.diff).map(k => `${k} ${gfmt(i, conv(i.diff[k]))}`);
  return parts.length ? "Andere Schwierigkeiten: " + parts.join(" · ") : "";
}
function rowModel(path) {
  const [k, id] = path.split("|");
  if (k === "glob") {
    const i = GITEMS[id], v = S.glob[id], o = i.value, ch = v !== o;
    const r = m => `${num(i.base[0] * m, i.dec)}–${num(i.base[1] * m, i.dec)}`;
    const info = i.base
      ? (ch ? `<span class="o">${r(o)}</span><span class="arrow">→</span><span class="nw">${r(v)} ${i.unit}</span>` : `<span class="nw">${r(v)} ${i.unit}</span>`)
      : prevInfo(ch, gfmt(i, o));
    return { label: i.label, sub: esc(i.sub || ""), df: gdiff(i, v), info, value: gfmt(i, v), ch, v, o, min: i.min, max: i.max, step: i.step };
  }
  if (k === "money") {
    const m = MONEY[id], v = S.money[id];
    return { label: m.label, info: rangeInfo(m.min, m.max, v), value: "×" + de(v, 1), ch: v !== 1, v, o: 1, min: 0.5, max: 5, step: 0.5 };
  }
  if (k === "loot") {
    const l = LOOT[id], v = S.loot[id];

// Demo: Platzhalter-Hash. Echt: MD5 der Pak, die die .exe im Speicher baut (ohne etwas zu schreiben).
function fnvCode(d) {
  let h = 2166136261;
  for (const ch of JSON.stringify(d)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  const x = h.toString(16).toUpperCase().padStart(8, "0");
  return x.slice(0, 4) + "-" + x.slice(4);
}
let preview = { key: null, code: null, files: [], error: null }, previewTimer = null;
function modCode() {
  const d = diff(), key = stable(d);
  if (!LIVE) return fnvCode(d);
  if (preview.key === key) return preview.code;
  clearTimeout(previewTimer);
  previewTimer = setTimeout(async () => {
    const r = await api("/api/preview", { diff: d }).catch(() => ({ error: "Keine Verbindung zum Tool" }));
    preview = { key, code: r.code || null, files: r.files || [], error: r.error || null };
    if (stable(diff()) === key) renderChrome();
  }, 250);
  return undefined;   // wird gerade berechnet
}

// Fokus nach dem Neuzeichnen wiederherstellen (Tastaturbedienung)
const FKEYS = ["data-sec", "data-cat", "data-gchip", "data-only", "data-tier", "data-preset", "data-reset", "data-split", "data-sync", "data-reset-sec", "data-path"];
function focusKey(el) {
  if (!el || el === document.body) return null;
  if (el.id) return { sel: "#" + el.id };
  const step = el.closest(".step");
  if (step) return { sel: `.step[data-path="${CSS.escape(step.dataset.path)}"] ${el.tagName === "INPUT" ? "input" : `button[data-d="${el.dataset.d}"]`}` };
  if (el.dataset.resetPath) return { sel: `input[data-path="${CSS.escape(el.dataset.resetPath)}"]`, alt: `.step[data-path="${CSS.escape(el.dataset.resetPath)}"] input` };
  for (const a of FKEYS) if (el.hasAttribute(a)) return { sel: `${el.tagName.toLowerCase()}[${a}="${CSS.escape(el.getAttribute(a))}"]` };
  return null;
}
function render(keepScroll = true) {
  const fk = focusKey(document.activeElement);
  renderChrome();
  const el = $("#content"), top = el.scrollTop;
  el.innerHTML = RENDER[ui.sec]();
  el.scrollTop = keepScroll ? top : 0;
  if (fk) {
    const t = document.querySelector(fk.sel) || (fk.alt && document.querySelector(fk.alt));
    if (t && !t.hidden) t.focus({ preventScroll: true });
  }
}

function setPath(path, v) {
  const p = path.split("|");
  if (p[0] === "craft") {
    const [, fam, ti, field, j] = p;
    const tiers = (ui.split[fam] || tiersDiffer(fam)) ? [+ti] : S.craft[fam].map((_, i) => i);
    for (const i of tiers) { if (field === "mats") S.craft[fam][i].mats[j] = v; else S.craft[fam][i][field] = v; }
  } else S[p[0]][p[1]] = v;
}
function resetPath(path) {
  const p = path.split("|");
  if (p[0] === "craft") {
    const [, fam, ti, field, j] = p;
    const tiers = (ui.split[fam] || tiersDiffer(fam)) ? [+ti] : S.craft[fam].map((_, i) => i);
    for (const i of tiers) { if (field === "mats") S.craft[fam][i].mats[j] = ORIG.craft[fam][i].mats[j]; else S.craft[fam][i][field] = ORIG.craft[fam][i][field]; }
  } else S[p[0]][p[1]] = ORIG[p[0]][p[1]];
}
function stepCommit(box, v) {
  const min = +box.dataset.min, max = +box.dataset.max, dec = +box.dataset.dec;
  v = Math.min(max, Math.max(min, +v.toFixed(dec || 0)));
  setPath(box.dataset.path, v);
  render();
}
function resetSection(sec) {
  if (sec === "loot") { S.loot = clone(ORIG.loot); S.money = clone(ORIG.money); }
  else S[sec] = clone(ORIG[sec]);
}

function diff(st = S) {
  const d = {};
  for (const k in st) for (const id in st[k]) if (!eq(st[k][id], ORIG[k][id])) (d[k] ||= {})[id] = st[k][id];
  return d;
}
const toB64 = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const fromB64 = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
const pipe = async (bytes, stream) => new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());
// Code = "DERO2." + base64url(deflate({ v: Tool-Version, d: Diff })). DERO1 (unkomprimiert, nur Diff) wird noch gelesen.
async function encodeShare() {
  const payload = JSON.stringify({ v: VERSION, d: diff() });
  return "DERO2." + toB64(await pipe(new TextEncoder().encode(payload), new CompressionStream("deflate-raw")));
}
async function decodeShare(raw) {
  raw = raw.replace(/\s+/g, "");
  let json;
  try {
    if (raw.startsWith("DERO2.")) json = new TextDecoder().decode(await pipe(fromB64(raw.slice(6)), new DecompressionStream("deflate-raw")));
    else if (raw.startsWith("DERO1.")) json = new TextDecoder().decode(fromB64(raw.slice(6)));
    else throw 0;
    json = JSON.parse(json);
  } catch { throw "Das ist kein gültiger DERO-Code. Wurde er vollständig kopiert?"; }
  const wrapped = json && typeof json === "object" && "d" in json && "v" in json;
  return { s: validate(wrapped ? json.d : json), ver: wrapped ? String(json.v) : null };
}
function validate(d) {
  if (!d || typeof d !== "object" || Array.isArray(d)) throw "Der Code ist beschädigt.";
  const s = clone(ORIG), inR = (v, lo, hi) => typeof v === "number" && isFinite(v) && v >= lo && v <= hi;
  for (const k in d) {
    if (!(k in s) || !d[k] || typeof d[k] !== "object") throw `Unbekannter Bereich „${k}“. Ist der Code von einer anderen Tool-Version?`;
    for (const id in d[k]) {
      if (!(id in s[k])) throw `Unbekannter Wert „${id}“. Passt der Code zu dieser Spielversion?`;
      const v = d[k][id], o = s[k][id];
      const ok = k === "glob" ? inR(v, GITEMS[id].min, GITEMS[id].max)
        : k === "craft" ? Array.isArray(v) && v.length === o.length && v.every((t, i) => t && Array.isArray(t.mats) && t.mats.length === o[i].mats.length
            && t.mats.every(m => Number.isInteger(m) && inR(m, 0, 999)) && Number.isInteger(t.out) && inR(t.out, 1, 999)
            && (o[i].head == null ? t.head == null : inR(t.head, 0.5, 20)))
        : k === "trade" ? (id === "buy" ? inR(v, 0.25, 2) : inR(v, 0, 1))
        : inR(v, 0.5, 5);
      if (!ok) throw `Ungültiger Wert bei „${id}“.`;
      s[k][id] = v;
    }
  }
  return s;
}
let pendingShare = null, shareSeq = 0;
async function openShare() {
  $("#shareIn").value = ""; $("#shareStatus").textContent = ""; $("#shareStatus").className = "shint"; $("#btnApply").disabled = true; pendingShare = null;
  const code = await encodeShare();
  $("#shareOut").value = code;
  $("#shareLen").textContent = `${de(code.length)} Zeichen`;
  openModal("#mShare");
}
async function checkShare() {
  const seq = ++shareSeq, raw = $("#shareIn").value.trim(), st = $("#shareStatus");
  pendingShare = null; $("#btnApply").disabled = true;
  if (!raw) { st.textContent = ""; st.className = "shint"; return; }
  try {
    const { s, ver } = await decodeShare(raw);
    if (seq !== shareSeq) return;
    const c = changes(s);
    pendingShare = s; $("#btnApply").disabled = false;
    st.className = "shint ok";
    st.textContent = `✓ Gültig: ${total(c) ? summary(c) : "alles original"}. Ersetzt deine aktuellen Einstellungen.`
      + (ver && ver !== VERSION ? ` Achtung: Der Code stammt aus Version ${ver}, du hast ${VERSION}. Für den gleichen Mod-Code bitte beide auf denselben Stand bringen.` : "");
  } catch (e) {
    if (seq !== shareSeq) return;
    st.className = "shint err"; st.textContent = typeof e === "string" ? e : "Der Code konnte nicht gelesen werden.";
  }
}
function applyShare() {
  if (!pendingShare) return;
  const prev = clone(S);
  S = pendingShare; pendingShare = null;
  closeModal($("#mShare"));
  render();
  toast("Einstellungen übernommen", () => { S = prev; render(); });
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const ta = Object.assign(document.createElement("textarea"), { value: text });
  ta.style.cssText = "position:fixed;opacity:0";
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch {}
  ta.remove();
  return ok;
}
async function copyAndToast(text, what) {
  toast(await copyText(text) ? `${what} kopiert` : `Kopieren hat nicht geklappt – bitte markieren und mit Strg+C kopieren`);
}

// ---------- Patchen ----------
const FILES = { craft: ["collectables_ft.scr", "inventory.scr"], loot: ["lootsets_ft.loot"], dis: ["lootsets_ft.loot"], trade: ["price_manager_params*.scr", "player_variables.scr"] };
function patchFiles(c) {
  if (LIVE && preview.key === stable(diff())) return preview.files;
  const f = [];
  for (const k in FILES) if (c[k].length) f.push(...FILES[k]);
  for (const id of c.glob) f.push(...GITEMS[id].files);
  return [...new Set(f)];
}
function openPatch() {
  const c = changes(), n = total(c);
  if (!n) {
    $("#patchBody").innerHTML = `<p>Alles steht auf Original – es gibt nichts zu patchen.</p>${installed ? `<p>Es ist aber noch ein Mod installiert (${esc(installed.pak)}). Entferne ihn, damit das Spiel wieder komplett original ist.</p>` : ""}`;
    $("#patchActs").innerHTML = `<button class="btn" data-close>Schließen</button>${installed ? `<button class="btn danger" id="btnRemove2">Mod entfernen</button>` : ""}`;
  } else {
    const code = modCode();
    const target = installed ? esc(installed.pak) : "eine eigene Mod-Datei (data2.pak bis data7.pak)";
    $("#patchBody").innerHTML = `<p>Das wird geändert:</p>
      <div class="sumlist">${SECTIONS.filter(s => c[s.id].length).map(s => `<div><span>${s.label}</span><b>${c[s.id].length}</b></div>`).join("")}</div>
      <ul class="checks">
        <li class="warn">Das Spiel muss dafür geschlossen sein.</li>
        <li>Originaldateien bleiben unverändert, geschrieben wird nur ${target}.</li>
        <li>Rückgängig jederzeit über „Mod entfernen“.</li>
        <li>Koop: Deine Partnerin braucht danach denselben Mod-Code${code ? ` <b>${code}</b>` : ""}.</li>
      </ul>${LIVE ? "" : `<p style="margin:14px 0 0;font-size:12px;color:var(--dim)">Demo – es wird nichts geschrieben.</p>`}`;
    $("#patchActs").innerHTML = `<button class="btn" data-close>Abbrechen</button><button class="btn primary small" id="btnDoPatch" data-autofocus><span>Jetzt patchen</span></button>`;
  }
  openModal("#mPatch");
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function runPatch() {
  const d = diff(), files = patchFiles(changes());
  const steps = ["Originaldaten aus data0.pak lesen", `${files.length} Spieldateien anpassen`, "Mod-Datei schreiben", "Prüfen"];
  $("#patchBody").innerHTML = `<div class="steps">${steps.map((s, i) => `<div class="stp" id="st${i}"><i></i>${s}${i === 1 ? `<span class="files">${esc(files.join(" · "))}</span>` : ""}</div>`).join("")}</div>`;
  $("#patchActs").innerHTML = "";
  const step = (i, cls) => { $("#st" + i).className = "stp " + cls; if (cls === "done") $("#st" + i + " i").textContent = "✓"; };
  let res;
  if (LIVE) {
    step(0, "run");
    [res] = await Promise.all([api("/api/patch", { diff: d }).catch(() => ({ error: "Keine Verbindung zum Tool." })), sleep(500)]);
    if (res.error) {
      $("#patchBody").innerHTML = `<p class="err">${esc(res.error)}</p>`;
      $("#patchActs").innerHTML = `<button class="btn" data-close>Schließen</button><button class="btn primary small" id="btnDoPatch" data-autofocus><span>Nochmal versuchen</span></button>`;
      $("#btnDoPatch").focus();
      return;
    }
  } else res = { pak: installed ? installed.pak : "data2.pak", code: fnvCode(d), files };
  for (let i = 0; i < steps.length; i++) { step(i, "run"); await sleep(LIVE ? 160 : 480); step(i, "done"); }
  finishPatch(res, d);
}
function finishPatch(res, d) {
  installed = { pak: res.pak, code: res.code, diff: d, legacy: false, outdated: false };
  preview = { key: stable(d), code: res.code, files: res.files || [], error: null };
  $("#patchBody").innerHTML = `<div class="result"><small>Fertig! Gespeichert als ${esc(res.pak)} · Dein Mod-Code</small><div class="big">${esc(res.code)}</div>
      <button class="btn" id="btnCopyCode">Mod-Code kopieren</button></div>
    <div class="coop"><b>Koop:</b> Deine Partnerin muss denselben Mod-Code haben. Schick ihr deinen Teilen-Code, sie übernimmt ihn und patcht ebenfalls.
      <br><button class="btn" id="btnCopyShare">Teilen-Code kopieren</button></div>
    <p style="margin:14px 0 0">Danach einfach das Spiel starten. Beim Start erscheint der Hinweis „Modified game data detected“ – das ist normal.</p>`;
  $("#patchActs").innerHTML = `<button class="btn" data-close data-autofocus>Schließen</button>`;
  $("#patchActs button").focus();
  renderChrome();
}
async function removeMod() {
  if (!installed) return;
  if (!await ask("Mod entfernen?", `${installed.pak} wird gelöscht, das Spiel ist danach wieder original. Deine Einstellungen hier bleiben erhalten. Im Koop muss auch deine Partnerin den Mod entfernen.`, "Mod entfernen")) return;
  if (LIVE) {
    const r = await api("/api/remove", {}).catch(() => ({ error: "Keine Verbindung zum Tool." }));
    if (r.error) { toast(r.error); return; }
  }
  installed = null;
  closeModal($("#mPatch"));
  render();
  toast("Mod entfernt – das Spiel ist wieder original");
}

// ---------- Updates, Spielordner, Verbindung ----------
async function checkUpdate(force) {
  const r = await api("/api/update" + (force ? "?force=1" : "")).catch(() => ({ error: "offline" }));
  ui.update = r.available ? r : null;
  if (force) toast(r.available ? `Version ${r.latest} ist verfügbar` : r.error ? "Update-Prüfung fehlgeschlagen – keine Verbindung zu GitHub?" : "Du hast die neueste Version");
  renderChrome();
}
function openUpdate() {
  const u = ui.update;
  if (!u) return;
  $("#updTitle").textContent = `Version ${u.latest} ist da`;
  $("#updText").textContent = `Du hast Version ${u.current}. Das Tool lädt die neue Version von GitHub, prüft sie und startet neu. Deine installierte Mod bleibt unverändert.`;
  $("#updNotes").textContent = (u.notes || "").trim();
  openModal("#mUpdate");
}
function overlay(title, text) {
  $("#overlayTitle").textContent = title;
  $("#overlayText").textContent = text;
  $("#overlay").hidden = !title;
}
async function installUpdate() {
  closeModal($("#mUpdate"));
  overlay("Update wird installiert", "Die neue Version wird geladen und geprüft …");
  const r = await api("/api/update", {}).catch(() => ({ error: "Keine Verbindung zum Tool." }));
  if (r.error) {
    overlay("");
    await ask("Update fehlgeschlagen", r.error + (r.url ? " Du kannst die neue Version auch selbst bei GitHub herunterladen." : ""), "OK");
    return;
  }
  overlay("Neustart", `Version ${r.version} ist installiert. Das Fenster öffnet sich gleich neu.`);
}
async function browseGame() {
  const r = await api("/api/browse", {}).catch(() => ({}));
  if (r.ok) location.reload();
}
if (LIVE) {
  setInterval(() => api("/api/ping", {}).catch(() => {}), 20000);
  addEventListener("pagehide", () => { api("/api/bye", {}).catch(() => {}); });
  setTimeout(() => checkUpdate(false), 1200);
}

let tt, toastUndo = null;
function toast(msg, undo) {
  $("#toastMsg").textContent = msg;
  toastUndo = undo || null;
  $("#toastAct").hidden = !undo;
  $("#toast").classList.add("show");
  clearTimeout(tt);
  tt = setTimeout(() => { $("#toast").classList.remove("show"); toastUndo = null; }, undo ? 6000 : 2600);
}

// ---------- Events ----------
document.addEventListener("click", async e => {
  const t = e.target.closest("button, [data-close]");
  if (!t) return;
  const d = t.dataset;
  if (d.sec) { ui.sec = d.sec; render(false); }
  else if (d.preset) loadPreset(d.preset);
  else if (d.cat) { ui.cat = d.cat; render(); }
  else if (d.gchip) { ui.gchip = d.gchip; render(false); }
  else if (d.only) { ui.only = !ui.only; render(); }
  else if (d.tier) { const [f, i] = d.tier.split("|"); ui.tier[f] = +i; render(); }
  else if (d.split) { const f = d.split; ui.split[f] = !(ui.split[f] || tiersDiffer(f)); ui.tier[f] = 0; render(); }
  else if (d.sync) { const [f, i] = d.sync.split("|"); S.craft[f] = S.craft[f].map(() => clone(S.craft[f][+i])); ui.split[f] = false; render(); toast("Alle Stufen angeglichen"); }
  else if (d.reset) { S.craft[d.reset] = clone(ORIG.craft[d.reset]); render(); }
  else if (d.resetPath) { resetPath(d.resetPath); render(); }
  else if (d.resetSec) {
    const prev = clone(S), sec = SECTIONS.find(s => s.id === d.resetSec);
    resetSection(d.resetSec); render();
    toast(`${sec.label} zurückgesetzt`, () => { S = prev; render(); });
  }
  else if (d.d) {
    const box = t.closest(".step"), cur = parseNum(box.querySelector("input").value, +box.dataset.dec);
    stepCommit(box, (isNaN(cur) ? 0 : cur) + d.d * +box.dataset.step);
  }
  else if (t.hasAttribute("data-close")) closeModal(t.closest(".modal"));
  else if (t.id === "askOk") { const r = askResolve; askResolve = null; closeModal($("#mAsk")); r && r(true); }
  else if (t.id === "toastAct") { const u = toastUndo; $("#toast").classList.remove("show"); toastUndo = null; u && u(); toast("Rückgängig gemacht"); }
  else if (t.id === "btnShare") openShare();
  else if (t.id === "btnCopy") copyAndToast($("#shareOut").value, "Teilen-Code");
  else if (t.id === "btnApply") applyShare();
  else if (t.id === "btnPatch") openPatch();
  else if (t.id === "btnDoPatch") runPatch();
  else if (t.id === "btnCopyCode") copyAndToast(installed ? installed.code : "", "Mod-Code");
  else if (t.id === "btnCopyShare") copyAndToast(await encodeShare(), "Teilen-Code");
  else if (t.id === "btnRemove" || t.id === "btnRemove2") removeMod();
  else if (t.id === "btnBrowse") browseGame();
  else if (t.id === "btnCheckUpd") checkUpdate(true);
  else if (t.id === "btnUpdate") installUpdate();
  else if (d.openUpdate) openUpdate();
  else if (d.patchNow) openPatch();
});
document.addEventListener("change", e => {
  const t = e.target, box = t.closest(".step");
  if (box) { const v = parseNum(t.value, +box.dataset.dec); isNaN(v) ? render() : stepCommit(box, v); }
  if (t.type === "range") render();
});
document.addEventListener("keydown", e => {
  const box = e.target.closest?.(".step");
  if (e.key === "Enter" && box && e.target.tagName === "INPUT") {
    e.preventDefault();
    const v = parseNum(e.target.value, +box.dataset.dec);
    isNaN(v) ? render() : stepCommit(box, v);
  }
  const open = [...document.querySelectorAll(".modal.open")].pop();
  if (!open) return;
  if (e.key === "Escape") closeModal(open);
  if (e.key === "Tab") {
    const f = [...open.querySelectorAll("button:not([disabled]), input")].filter(x => x.offsetParent);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q") { ui.q = t.value; const pos = t.selectionStart; render(); $("#q").setSelectionRange(pos, pos); return; }
  if (t.id === "shareIn") { checkShare(); return; }
  if (t.type !== "range") return;
  // Live-Vorschau beim Ziehen, ohne den Regler neu zu zeichnen
  const v = +t.value;
  setPath(t.dataset.path, v);
  t.style.setProperty("--p", ((v - t.min) / (t.max - t.min)) * 100 + "%");
  const row = t.closest(".srow");
  if (row) patchRow(row);
  updateExamples();
  renderChrome();
});
document.querySelectorAll(".modal").forEach(m => m.addEventListener("click", e => { if (e.target === m) closeModal(m); }));

render(false);
</script>
