# Baut bei jedem Tag vX.Y.Z die DERO-Patcher.exe und veroeffentlicht sie als GitHub-Release.
# Der Updater im Tool laedt DERO-Patcher.exe und prueft sie gegen DERO-Patcher.exe.sha256.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Bauen
        shell: cmd
        run: build.bat

      - name: Version pruefen, Pruefsumme und Zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $ver = (Get-Item dist/DERO-Patcher.exe).VersionInfo.FileVersion
          if (-not $ver.StartsWith($tag)) { throw "Tag v$tag passt nicht zur AssemblyVersion $ver in src/Program.cs" }
          $hash = (Get-FileHash dist/DERO-Patcher.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist/DERO-Patcher.exe.sha256", "$hash  DERO-Patcher.exe")
          Compress-Archive -Path dist/DERO-Patcher.exe, LIESMICH.txt -DestinationPath dist/DERO-Patcher.zip
          # Abschnitt "## vX.Y.Z" aus CHANGELOG.md als Release-Text
          $text = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($text, "(?ms)^## v$([regex]::Escape($tag))\b[^\n]*\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Siehe CHANGELOG.md" }
          [IO.File]::WriteAllText("dist/notes.md", $notes)

      - name: Release veroeffentlichen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/DERO-Patcher.exe dist/DERO-Patcher.exe.sha256 dist/DERO-Patcher.zip --title "DERO-Patcher ${{ github.ref_name }}" --notes-file dist/notes.md
